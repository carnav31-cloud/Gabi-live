   <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabi Live - Tiempo Real</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 1rem; min-height: 100vh; }
        h1 { color: #38bdf8; margin-bottom: 1rem; font-size: 1.5rem; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 1rem; }
        video { width: 100%; height: 240px; background: #000; border-radius: 12px; object-fit: cover; }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; background: #1e293b; padding: 1rem; border-radius: 12px; }
        input, select { padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
        button { padding: 1rem; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: #0284c7; color: white; margin-bottom: 0.5rem; }
        .status-box { background: #1e293b; padding: 1rem; font-family: monospace; font-size: 0.75rem; height: 200px; overflow-y: auto; color: #38bdf8; border: 1px solid #334155; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Gabi Live: Tiempo Real</h1>
    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="input-group">
            <input type="password" id="apiKey" placeholder="Pega tu API Key aquí">
            <label for="modelSelect">Modelo disponible:</label>
            <select id="modelSelect">
                <option value="models/gemini-2.5-flash-native-audio-latest">gemini-2.5-flash-native-audio-latest</option>
            </select>
        </div>
        <button onclick="checkModels()" style="background:#334155;">1. Consultar Modelos Disponibles</button>
        <button id="toggleBtn" onclick="toggleConnection()">2. Iniciar Conexión</button>
        <div class="status-box" id="logBox">Pega tu API Key y toca "Consultar Modelos Disponibles"</div>
    </div>

    <script>
        let ws = null;
        let mediaStream = null;
        let audioCtx = null;
        let audioOutputCtx = null;
        let frameInterval = null;
        let processor = null;
        let nextStartTime = 0;
        const logBox = document.getElementById('logBox');
        
        function log(msg) { logBox.innerText += `\n> ${msg}`; logBox.scrollTop = logBox.scrollHeight; }

        async function initCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: true
                });
                document.getElementById('webcam').srcObject = mediaStream;
            } catch (err) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: "environment" } },
                        audio: true
                    });
                    document.getElementById('webcam').srcObject = mediaStream;
                } catch (e) { log("Error cámara: " + e.message); }
            }
        }

        async function checkModels() {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) return alert("Pega tu API Key primero");
            
            log("Consultando modelos...");
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1alpha/models?key=${apiKey}`);
                const data = await res.json();
                if (data.models) {
                    const select = document.getElementById('modelSelect');
                    select.innerHTML = '';
                    const sortedModels = data.models.sort((a, b) => b.name.includes('native-audio') - a.name.includes('native-audio'));
                    sortedModels.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.name;
                        opt.innerText = m.name.replace('models/', '');
                        select.appendChild(opt);
                    });
                    log("Lista de modelos lista.");
                }
            } catch (err) { log("Error: " + err.message); }
        }

        function stopStreaming() {
            if (frameInterval) clearInterval(frameInterval);
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
        }

        function startTransmitting() {
            if (!audioOutputCtx) audioOutputCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            audioOutputCtx.resume();

            const videoEl = document.getElementById('webcam');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            frameInterval = setInterval(() => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                canvas.width = 160;
                canvas.height = 120;
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                const base64Image = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];

                ws.send(JSON.stringify({
                    realtimeInput: {
                        mediaChunks: [{ mimeType: "image/jpeg", data: base64Image }]
                    }
                }));
            }, 1000);

            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const source = audioCtx.createMediaStreamSource(mediaStream);
            processor = audioCtx.createScriptProcessor(4096, 1, 1);

            processor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                }
                
                let binary = '';
                const bytes = new Uint8Array(pcm16.buffer);
                for (let i = 0; i < bytes.byteLength; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64Audio = btoa(binary);

                ws.send(JSON.stringify({
                    realtimeInput: {
                        mediaChunks: [{ mimeType: "audio/pcm", data: base64Audio }]
                    }
                }));
            };

            source.connect(processor);
            processor.connect(audioCtx.destination);
            log("Transmitiendo micrófono y cámara trasera.");
        }

        function playAudioChunk(base64Pcm) {
            if (!audioOutputCtx) return;
            const binary = atob(base64Pcm);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            
            const int16 = new Int16Array(bytes.buffer);
            const float32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

            const buffer = audioOutputCtx.createBuffer(1, float32.length, 24000);
            buffer.getChannelData(0).set(float32);

            const source = audioOutputCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioOutputCtx.destination);

            const now = audioOutputCtx.currentTime;
            const startTime = Math.max(now, nextStartTime);
            source.start(startTime);
            nextStartTime = startTime + buffer.duration;
        }

        function toggleConnection() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                stopStreaming();
                ws.close();
                log("Conexión detenida.");
                return;
            }

            const apiKey = document.getElementById('apiKey').value.trim();
            const selectedModel = document.getElementById('modelSelect').value;
            const URL = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
            
            log("Conectando con: " + selectedModel);
            ws = new WebSocket(URL);

            ws.onopen = () => {
                log("Conectado. Enviando Setup...");
                ws.send(JSON.stringify({
                    setup: { 
                        model: selectedModel, 
                        generationConfig: { responseModalities: ["AUDIO"] } 
                    }
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const response = JSON.parse(event.data);
                    // Si recibimos la confirmación de setup o la primera respuesta
                    if (response.setupComplete) {
                        log("Setup confirmado por el servidor.");
                        startTransmitting();
                        return;
                    }

                    const parts = response.serverContent?.modelTurn?.parts;
                    if (parts) {
                        parts.forEach(p => {
                            if (p.inlineData && p.inlineData.data) {
                                playAudioChunk(p.inlineData.data);
                            }
                        });
                    }
                } catch (e) {}
            };

            ws.onclose = (event) => { 
                stopStreaming();
                log("Conexión cerrada: " + event.code); 
            };
            ws.onerror = (err) => { log("Error WS"); };
        }

        initCamera();
    </script>
</body>
</html>
