<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabi Live - Tiempo Real</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            min-height: 100vh;
        }
        h1 { color: #38bdf8; margin-bottom: 1rem; font-size: 1.5rem; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 1rem; }
        video { width: 100%; height: 240px; background: #000; border-radius: 12px; object-fit: cover; }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; background: #1e293b; padding: 1rem; border-radius: 12px; }
        label { font-size: 0.9rem; color: #94a3b8; }
        input, select { padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
        button { padding: 1rem; border-radius: 12px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:disabled { background: #334155; color: #64748b; }
        .status-box { background: #1e293b; border-radius: 12px; padding: 1rem; font-family: monospace; font-size: 0.85rem; height: 180px; overflow-y: auto; color: #38bdf8; border: 1px solid #334155; }
        .status-disconnected { color: #ef4444; }
        .status-connected { color: #22c55e; }
    </style>
</head>
<body>

    <h1>Gabi Live: Tiempo Real</h1>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>

        <div class="input-group">
            <label for="apiKey">API Key:</label>
            <input type="password" id="apiKey" placeholder="Pega tu Gemini API Key aquí">
            
            <label for="voiceSelect">Voz de Gabi:</label>
            <select id="voiceSelect">
                <option value="Aoede">Aoede (Cálida)</option>
                <option value="Puck">Puck (Animada)</option>
                <option value="Charon">Charon (Grave)</option>
                <option value="Kore">Kore (Relajada)</option>
                <option value="Fenrir">Fenrir (Intensa)</option>
            </select>
        </div>

        <button id="toggleBtn" class="btn-primary" onclick="toggleConnection()">Iniciar Conexión Live</button>

        <div class="status-box" id="logBox">Ingresa tu API Key y presiona Iniciar...</div>
    </div>

    <script>
        let ws = null;
        let mediaStream = null;
        let audioContext = null;
        let isConnected = false;
        let frameInterval = null;

        const logBox = document.getElementById('logBox');
        const toggleBtn = document.getElementById('toggleBtn');
        const webcam = document.getElementById('webcam');

        function log(msg) {
            logBox.innerText += `\n> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function initCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: true
                });
                webcam.srcObject = mediaStream;
                log("Cámara y micrófono iniciados.");
            } catch (err) {
                log("Error accediendo a cámara/micrófono: " + err.message);
            }
        }

        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }

        function connect() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const voice = document.getElementById('voiceSelect').value;

            if (!apiKey) {
                alert("Por favor ingresa tu API Key");
                return;
            }

            log("Iniciando WebSocket con Gemini Multimodal Live API...");
            
            // Endpoint v1alpha necesario para el WebSocket Bidireccional
            const URL = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;

            ws = new WebSocket(URL);

            ws.onopen = () => {
                log("Conexión establecida. Enviando configuración...");
                
                // Mensaje obligatorio de Setup inicial
                const setupMessage = {
                    setup: {
                        model: "models/gemini-2.0-flash-exp",
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: {
                                        voiceName: voice
                                    }
                                }
                            }
                        }
                    }
                };
                
                ws.send(JSON.stringify(setupMessage));
                isConnected = true;
                toggleBtn.innerText = "Desconectar";
                toggleBtn.style.background = "#dc2626";

                startStreamingFrames();
            };

            ws.onmessage = async (event) => {
                if (event.data instanceof Blob) {
                    log("Respuesta de audio recibida.");
                } else {
                    const data = JSON.parse(event.data);
                    if (data.serverContent?.modelTurn?.parts) {
                        log("Gabi está respondiendo...");
                    }
                }
            };

            ws.onerror = (err) => {
                log("Error en WebSocket: " + JSON.stringify(err));
            };

            ws.onclose = () => {
                log("Conexión cerrada.");
                disconnect();
            };
        }

        function startStreamingFrames() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 320;
            canvas.height = 240;

            frameInterval = setInterval(() => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;

                ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
                const base64Image = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];

                const frameMessage = {
                    realtimeInput: {
                        mediaChunks: [
                            {
                                mimeType: "image/jpeg",
                                data: base64Image
                            }
                        ]
                    }
                };

                ws.send(JSON.stringify(frameMessage));
            }, 1000); // Envía 1 fotograma por segundo
        }

        function disconnect() {
            if (frameInterval) clearInterval(frameInterval);
            if (ws) ws.close();
            
            isConnected = false;
            toggleBtn.innerText = "Iniciar Conexión Live";
            toggleBtn.style.background = "#0284c7";
        }

        // Iniciar cámara automáticamente al cargar
        initCamera();
    </script>
</body>
</html>
